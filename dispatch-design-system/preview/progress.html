<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:40px 24px; background:var(--surface-0); font-family:var(--font-body); color:var(--text-0); }
  .card { max-width:700px; margin:0 auto 48px; }
  .card-label { font-size:var(--text-xs); font-weight:var(--weight-semibold); text-transform:uppercase; letter-spacing:var(--tracking-widest); color:var(--text-3); margin-bottom:16px; }

  /* Progress bar */
  .progress-bar { width:100%; height:4px; background:var(--surface-2); border-radius:2px; overflow:hidden; margin-bottom:8px; }
  .progress-fill { height:100%; background:var(--primary-2); border-radius:2px; transition:width var(--duration-slow) var(--ease-default); }
  .progress-bar.lg { height:6px; }

  /* Spinner */
  .spinner { width:20px; height:20px; border:2px solid var(--line-2); border-top-color:var(--primary-2); border-radius:50%; animation:spin 0.6s linear infinite; display:inline-block; }
  .spinner.lg { width:32px; height:32px; border-width:3px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Skeleton */
  .skeleton {
    background: linear-gradient(90deg, var(--surface-1) 25%, var(--surface-2) 50%, var(--surface-1) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s ease-in-out infinite;
    border-radius: var(--radius-xs);
  }
  @keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
  .skeleton-line { height:12px; margin-bottom:8px; }
  .skeleton-heading { height:24px; width:60%; margin-bottom:12px; }
  .skeleton-text { height:12px; margin-bottom:8px; }
  .skeleton-text.short { width:40%; }

  /* Loading card */
  .skeleton-card {
    border: 1px solid var(--line-1);
    border-radius: var(--radius-md);
    padding: 20px;
    background: var(--surface-0);
    max-width: 320px;
  }

  .dot-loader { display:flex; gap:6px; }
  .dot-loader span {
    width:6px; height:6px; border-radius:50%; background:var(--primary-2); animation:dotPulse 1.2s ease-in-out infinite;
  }
  .dot-loader span:nth-child(2) { animation-delay:0.2s; }
  .dot-loader span:nth-child(3) { animation-delay:0.4s; }
  @keyframes dotPulse { 0%,80%,100% { opacity:0.3; transform:scale(0.8); } 40% { opacity:1; transform:scale(1); } }
</style>
</head>
<body>

<div class="card">
  <div class="card-label">Progress Bars</div>
  <div style="max-width:400px;">
    <div class="progress-bar"><div class="progress-fill" style="width:25%;"></div></div>
    <div style="font-size:var(--text-xs); color:var(--text-3); margin-bottom:16px;">25% — 1 of 4 stories read</div>
    <div class="progress-bar"><div class="progress-fill" style="width:75%;"></div></div>
    <div style="font-size:var(--text-xs); color:var(--text-3); margin-bottom:16px;">75% — 3 of 4 stories read</div>
    <div class="progress-bar lg"><div class="progress-fill" style="width:100%; background:var(--success-1);"></div></div>
    <div style="font-size:var(--text-xs); color:var(--success-1);">100% — All stories read</div>
  </div>
</div>

<div class="card">
  <div class="card-label">Spinners</div>
  <div style="display:flex; align-items:center; gap:16px;">
    <div class="spinner"></div>
    <div class="spinner lg"></div>
    <span style="font-size:var(--text-sm); color:var(--text-2);">Loading briefing…</span>
  </div>
</div>

<div class="card">
  <div class="card-label">Dot Loader</div>
  <div style="display:flex; align-items:center; gap:12px;">
    <div class="dot-loader"><span></span><span></span><span></span></div>
    <span style="font-size:var(--text-sm); color:var(--text-2);">Fetching stories</span>
  </div>
</div>

<div class="card">
  <div class="card-label">Skeleton Loading</div>
  <div class="skeleton-card">
    <div class="skeleton skeleton-heading"></div>
    <div class="skeleton skeleton-text" style="width:100%;"></div>
    <div class="skeleton skeleton-text" style="width:85%;"></div>
    <div class="skeleton skeleton-text short"></div>
  </div>
</div>

</body>
</html>
