<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:40px 24px; background:var(--surface-0); font-family:var(--font-body); color:var(--text-0); }
  .card { max-width:700px; margin:0 auto 48px; }
  .card-label { font-size:var(--text-xs); font-weight:var(--weight-semibold); text-transform:uppercase; letter-spacing:var(--tracking-widest); color:var(--text-3); margin-bottom:16px; }

  /* Tooltip */
  .tooltip-demo { display:flex; gap:16px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .tooltip-wrap { position:relative; display:inline-flex; }
  .tooltip-trigger {
    background: var(--surface-0);
    border: 1px solid var(--line-2);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    font-family: var(--font-body);
    font-size: var(--text-sm);
    color: var(--text-1);
    cursor: pointer;
    transition: border-color var(--duration-fast) var(--ease-default);
  }
  .tooltip-trigger:hover { border-color: var(--line-3); }
  .tooltip {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface-5);
    color: #e8e8e4;
    font-size: var(--text-xs);
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    pointer-events: none;
    box-shadow: var(--sh-md);
  }
  .tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--surface-5);
  }

  /* Dropdown */
  .dropdown-demo { position:relative; display:inline-block; }
  .dropdown-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: var(--surface-0);
    border: 1px solid var(--line-2);
    border-radius: var(--radius-sm);
    font-family: var(--font-body);
    font-size: var(--text-sm);
    color: var(--text-0);
    cursor: pointer;
    transition: border-color var(--duration-fast) var(--ease-default);
  }
  .dropdown-btn:hover { border-color: var(--line-3); }
  .dropdown-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    min-width: 180px;
    background: var(--surface-0);
    border: 1px solid var(--line-2);
    border-radius: var(--radius-md);
    box-shadow: var(--sh-lg);
    padding: 4px 0;
    z-index: 10;
  }
  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    font-size: var(--text-sm);
    color: var(--text-1);
    cursor: pointer;
    transition: background var(--duration-fast) var(--ease-default), color var(--duration-fast) var(--ease-default);
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }
  .dropdown-item:hover { background: var(--surface-1); color: var(--text-0); }
  .dropdown-item.active { color: var(--primary-2); }
  .dropdown-sep { border-top: 1px solid var(--line-1); margin: 4px 0; }
</style>
</head>
<body>

<div class="card">
  <div class="card-label">Tooltips</div>
  <div class="tooltip-demo">
    <div class="tooltip-wrap">
      <button class="tooltip-trigger">Bookmark</button>
      <div class="tooltip">Save to reading list</div>
    </div>
    <div class="tooltip-wrap">
      <button class="tooltip-trigger">Share</button>
      <div class="tooltip">Copy link to story</div>
    </div>
    <div class="tooltip-wrap">
      <button class="tooltip-trigger">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 8v4M12 16h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
      </button>
      <div class="tooltip">Source info</div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-label">Dropdown Menu</div>
  <div class="dropdown-demo">
    <button class="dropdown-btn">
      Sort by
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="dropdown-menu">
      <button class="dropdown-item active">Newest first</button>
      <button class="dropdown-item">Oldest first</button>
      <button class="dropdown-item">Most sources</button>
      <div class="dropdown-sep"></div>
      <button class="dropdown-item">Reading time</button>
    </div>
  </div>
</div>

</body>
</html>
