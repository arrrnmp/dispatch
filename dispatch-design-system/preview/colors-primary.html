<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 40px 24px;
    background: var(--surface-0);
    font-family: var(--font-body);
    color: var(--text-0);
  }
  .card { max-width: 700px; margin: 0 auto 48px; }
  .card-label {
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-widest);
    color: var(--text-3);
    margin-bottom: 16px;
  }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch {
    width: 120px;
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 1px solid var(--line-1);
  }
  .swatch-fill { height: 80px; }
  .swatch-info {
    padding: 8px 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.5;
    color: var(--text-2);
    background: var(--surface-0);
  }
  .swatch-info .name {
    font-family: var(--font-body);
    font-weight: var(--weight-semibold);
    font-size: 11px;
    color: var(--text-0);
    display: block;
    margin-bottom: 2px;
  }
  .fill-0 { background: var(--primary-0); }
  .fill-1 { background: var(--primary-1); }
  .fill-2 { background: var(--primary-2); }
  .fill-3 { background: var(--primary-3); }
  .fill-4 { background: var(--primary-4); }
</style>
</head>
<body>

<div class="card">
  <div class="card-label">Primary Accent · Warm Orange</div>
  <div class="swatches">
    <div class="swatch">
      <div class="swatch-fill fill-0"></div>
      <div class="swatch-info">
        <span class="name">primary-0</span>
        #fff4eb
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-fill fill-1"></div>
      <div class="swatch-info">
        <span class="name">primary-1</span>
        #ffd8b8
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-fill fill-2"></div>
      <div class="swatch-info">
        <span class="name">primary-2</span>
        #f26522
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-fill fill-3"></div>
      <div class="swatch-info">
        <span class="name">primary-3</span>
        #da5a1e
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-fill fill-4"></div>
      <div class="swatch-info">
        <span class="name">primary-4</span>
        #b34a18
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-label">Usage</div>
  <div style="display: flex; flex-direction: column; gap: 12px; max-width: 500px;">
    <button style="
      background: var(--primary-2);
      color: #fff;
      border: 1px solid var(--primary-2);
      border-radius: var(--radius-sm);
      padding: 10px 20px;
      font-family: var(--font-body);
      font-weight: var(--weight-semibold);
      font-size: var(--text-sm);
      cursor: pointer;
    ">Primary Button</button>
    <div style="
      background: var(--primary-0);
      border: 1px solid var(--primary-1);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-size: var(--text-sm);
      color: var(--primary-4);
    ">Subtle tint background with accent text</div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 6px; height: 6px; border-radius: 50%; background: var(--primary-2);"></div>
      <span style="font-size: var(--text-xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: var(--tracking-widest); color: var(--primary-2);">World</span>
    </div>
  </div>
</div>

</body>
</html>
