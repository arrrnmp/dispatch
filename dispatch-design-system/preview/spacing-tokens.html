<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 40px 24px;
    background: var(--surface-0);
    font-family: var(--font-body);
    color: var(--text-0);
  }
  .card { max-width: 700px; margin: 0 auto 48px; }
  .card-label {
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-widest);
    color: var(--text-3);
    margin-bottom: 16px;
  }
  .scale-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .scale-name {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-2);
    width: 56px;
    text-align: right;
    flex-shrink: 0;
  }
  .scale-px {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-3);
    width: 36px;
    flex-shrink: 0;
  }
  .scale-bar {
    height: 16px;
    background: var(--primary-2);
    border-radius: 2px;
    opacity: 0.7;
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-label">Spacing Scale · 4px Grid</div>
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div class="scale-row">
      <span class="scale-name">sp-1</span>
      <span class="scale-px">4px</span>
      <div class="scale-bar" style="width: 4px;"></div>
    </div>
    <div class="scale-row">
      <span class="scale-name">sp-2</span>
      <span class="scale-px">8px</span>
      <div class="scale-bar" style="width: 8px;"></div>
    </div>
    <div class="scale-row">
      <span class="scale-name">sp-3</span>
      <span class="scale-px">12px</span>
      <div class="scale-bar" style="width: 12px;"></div>
    </div>
    <div class="scale-row">
      <span class="scale-name">sp-4</span>
      <span class="scale-px">16px</span>
      <div class="scale-bar" style="width: 16px;"></div>
    </div>
    <div class="scale-row">
      <span class="scale-name">sp-5</span>
      <span class="scale-px">20px</span>
      <div class="scale-bar" style="width: 20px;"></div>
    </div>
    <div class="scale-row">
      <span class="scale-name">sp-6</span>
      <span class="scale-px">24px</span>
      <div class="scale-bar" style="width: 24px;"></div>
    </div>
    <div class="scale-row">
      <span class="scale-name">sp-8</span>
      <span class="scale-px">32px</span>
      <div class="scale-bar" style="width: 32px;"></div>
    </div>
    <div class="scale-row">
      <span class="scale-name">sp-10</span>
      <span class="scale-px">40px</span>
      <div class="scale-bar" style="width: 40px;"></div>
    </div>
    <div class="scale-row">
      <span class="scale-name">sp-12</span>
      <span class="scale-px">48px</span>
      <div class="scale-bar" style="width: 48px;"></div>
    </div>
    <div class="scale-row">
      <span class="scale-name">sp-16</span>
      <span class="scale-px">64px</span>
      <div class="scale-bar" style="width: 64px;"></div>
    </div>
    <div class="scale-row">
      <span class="scale-name">sp-20</span>
      <span class="scale-px">80px</span>
      <div class="scale-bar" style="width: 80px;"></div>
    </div>
    <div class="scale-row">
      <span class="scale-name">sp-24</span>
      <span class="scale-px">96px</span>
      <div class="scale-bar" style="width: 96px;"></div>
    </div>
  </div>
</div>

</body>
</html>
