<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 40px 24px;
    background: var(--surface-0);
    font-family: var(--font-body);
    color: var(--text-0);
  }
  .card { max-width: 700px; margin: 0 auto 48px; }
  .card-label {
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-widest);
    color: var(--text-3);
    margin-bottom: 16px;
  }
  .field { margin-bottom: 20px; max-width: 420px; }
  .field-label {
    display: block;
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wider);
    color: var(--text-2);
    margin-bottom: 6px;
  }
  .input, .textarea, .select {
    width: 100%;
    padding: 10px 16px;
    border: 1px solid var(--line-2);
    border-radius: var(--radius-sm);
    font-family: var(--font-body);
    font-size: var(--text-base);
    color: var(--text-0);
    background: var(--surface-0);
    box-sizing: border-box;
    transition: border-color var(--duration-fast) var(--ease-default), box-shadow var(--duration-fast) var(--ease-default);
  }
  .input:focus, .textarea:focus, .select:focus {
    outline: 2px solid var(--primary-2);
    outline-offset: 2px;
    border-color: transparent;
  }
  .input::placeholder, .textarea::placeholder { color: var(--text-3); }
  .input:hover, .textarea:hover, .select:hover { border-color: var(--line-3); }
  .input:disabled, .textarea:disabled {
    background: var(--surface-1);
    color: var(--text-3);
    border-color: var(--line-1);
    cursor: not-allowed;
  }
  .textarea { resize: vertical; min-height: 80px; }
  .select { appearance: none; cursor: pointer; }

  .input-error { border-color: var(--error-1); }
  .input-error:focus { outline-color: var(--error-1); }
  .field-error {
    font-size: var(--text-xs);
    color: var(--error-1);
    margin-top: 4px;
  }
  .field-hint {
    font-size: var(--text-xs);
    color: var(--text-3);
    margin-top: 4px;
  }

  .checkbox-row, .radio-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    font-size: var(--text-sm);
    color: var(--text-1);
  }
  .checkbox-row input, .radio-row input {
    width: 18px;
    height: 18px;
    accent-color: var(--primary-2);
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-label">Text Input</div>
  <div class="field">
    <label class="field-label">Search</label>
    <input class="input" type="text" placeholder="Search the archive…">
  </div>
  <div class="field">
    <label class="field-label">With Value</label>
    <input class="input" type="text" value="Central Bank Policy">
  </div>
  <div class="field">
    <label class="field-label">Disabled</label>
    <input class="input" type="text" value="Read-only field" disabled>
  </div>
  <div class="field">
    <label class="field-label">Error State</label>
    <input class="input input-error" type="text" value="invalid-date">
    <div class="field-error">Please enter a valid date format</div>
  </div>
  <div class="field">
    <label class="field-label">With Hint</label>
    <input class="input" type="email" placeholder="you@example.com">
    <div class="field-hint">Used for your daily digest delivery</div>
  </div>
</div>

<div class="card">
  <div class="card-label">Textarea</div>
  <div class="field">
    <label class="field-label">Notes</label>
    <textarea class="textarea" placeholder="Add a note about this story…"></textarea>
  </div>
</div>

<div class="card">
  <div class="card-label">Select</div>
  <div class="field">
    <label class="field-label">Category</label>
    <select class="select">
      <option>World</option>
      <option>Technology</option>
      <option>Markets</option>
      <option>Culture</option>
    </select>
  </div>
</div>

<div class="card">
  <div class="card-label">Checkboxes & Radios</div>
  <label class="checkbox-row"><input type="checkbox" checked> Include summaries</label>
  <label class="checkbox-row"><input type="checkbox"> Include source links</label>
  <label class="checkbox-row"><input type="checkbox" disabled> Premium only</label>
  <div style="height: 16px;"></div>
  <label class="radio-row"><input type="radio" name="freq" checked> Daily</label>
  <label class="radio-row"><input type="radio" name="freq"> Weekly</label>
</div>

</body>
</html>
