<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 40px 24px;
    background: var(--surface-0);
    font-family: var(--font-body);
    color: var(--text-0);
  }
  .card { max-width: 700px; margin: 0 auto 48px; }
  .card-label {
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-widest);
    color: var(--text-3);
    margin-bottom: 16px;
  }
  .shadow-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }
  .shadow-name {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-2);
    width: 72px;
    text-align: right;
    flex-shrink: 0;
  }
  .shadow-box {
    width: 160px;
    height: 80px;
    background: var(--surface-0);
    border-radius: var(--radius-md);
    border: 1px solid var(--line-1);
  }
  .s-xs { box-shadow: var(--sh-xs); }
  .s-sm { box-shadow: var(--sh-sm); }
  .s-md { box-shadow: var(--sh-md); }
  .s-lg { box-shadow: var(--sh-lg); }
  .s-xl { box-shadow: var(--sh-xl); }
  .s-inset {
    box-shadow: var(--sh-inset);
    background: var(--surface-1);
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-label">Shadow Scale</div>
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <div class="shadow-row">
      <span class="shadow-name">sh-xs</span>
      <div class="shadow-box s-xs"></div>
    </div>
    <div class="shadow-row">
      <span class="shadow-name">sh-sm</span>
      <div class="shadow-box s-sm"></div>
    </div>
    <div class="shadow-row">
      <span class="shadow-name">sh-md</span>
      <div class="shadow-box s-md"></div>
    </div>
    <div class="shadow-row">
      <span class="shadow-name">sh-lg</span>
      <div class="shadow-box s-lg"></div>
    </div>
    <div class="shadow-row">
      <span class="shadow-name">sh-xl</span>
      <div class="shadow-box s-xl"></div>
    </div>
    <div class="shadow-row">
      <span class="shadow-name">sh-inset</span>
      <div class="shadow-box s-inset"></div>
    </div>
  </div>
</div>

</body>
</html>
