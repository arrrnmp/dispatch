<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 40px 24px;
    background: var(--surface-0);
    font-family: var(--font-body);
    color: var(--text-0);
  }
  .card { max-width: 700px; margin: 0 auto 48px; }
  .card-label {
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-widest);
    color: var(--text-3);
    margin-bottom: 16px;
  }
  .row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 12px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: var(--font-body);
    font-weight: var(--weight-semibold);
    font-size: var(--text-sm);
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform var(--duration-fast) var(--ease-default), background var(--duration-fast) var(--ease-default), border-color var(--duration-fast) var(--ease-default), box-shadow var(--duration-fast) var(--ease-default);
  }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible {
    outline: 2px solid var(--primary-2);
    outline-offset: 2px;
  }
  .btn-sm { padding: 6px 12px; border-radius: var(--radius-sm); font-size: var(--text-xs); }
  .btn-md { padding: 10px 20px; border-radius: var(--radius-sm); }
  .btn-lg { padding: 14px 28px; border-radius: var(--radius-sm); font-size: var(--text-base); }

  .btn-primary {
    background: var(--primary-2);
    color: #fff;
    border-color: var(--primary-2);
  }
  .btn-primary:hover {
    background: var(--primary-3);
    border-color: var(--primary-3);
    transform: translateY(-1px);
    box-shadow: var(--sh-sm);
  }
  .btn-primary:disabled {
    background: var(--surface-3);
    border-color: var(--surface-3);
    color: var(--text-3);
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .btn-secondary {
    background: var(--surface-0);
    color: var(--text-0);
    border-color: var(--line-2);
  }
  .btn-secondary:hover {
    background: var(--surface-1);
    border-color: var(--line-3);
    transform: translateY(-1px);
  }
  .btn-secondary:disabled {
    background: var(--surface-1);
    color: var(--text-3);
    border-color: var(--line-1);
    cursor: not-allowed;
    transform: none;
  }

  .btn-ghost {
    background: transparent;
    color: var(--text-1);
    border-color: transparent;
  }
  .btn-ghost:hover {
    background: var(--surface-1);
    color: var(--text-0);
  }

  .btn-danger {
    background: var(--error-1);
    color: #fff;
    border-color: var(--error-1);
  }
  .btn-danger:hover {
    background: var(--crimson-2);
    border-color: var(--crimson-2);
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-label">Primary · Sizes</div>
  <div class="row">
    <button class="btn btn-primary btn-sm">Small</button>
    <button class="btn btn-primary btn-md">Medium</button>
    <button class="btn btn-primary btn-lg">Large</button>
  </div>
</div>

<div class="card">
  <div class="card-label">Primary · States</div>
  <div class="row">
    <button class="btn btn-primary btn-md">Default</button>
    <button class="btn btn-primary btn-md" style="background: var(--primary-3); border-color: var(--primary-3); transform: translateY(-1px); box-shadow: var(--sh-sm);">Hover</button>
    <button class="btn btn-primary btn-md" style="transform: scale(0.98);">Active</button>
    <button class="btn btn-primary btn-md" disabled>Disabled</button>
  </div>
</div>

<div class="card">
  <div class="card-label">Secondary · States</div>
  <div class="row">
    <button class="btn btn-secondary btn-md">Default</button>
    <button class="btn btn-secondary btn-md" style="background: var(--surface-1); border-color: var(--line-3); transform: translateY(-1px);">Hover</button>
    <button class="btn btn-secondary btn-md" disabled>Disabled</button>
  </div>
</div>

<div class="card">
  <div class="card-label">Ghost · States</div>
  <div class="row">
    <button class="btn btn-ghost btn-md">Default</button>
    <button class="btn btn-ghost btn-md" style="background: var(--surface-1); color: var(--text-0);">Hover</button>
  </div>
</div>

<div class="card">
  <div class="card-label">Danger</div>
  <div class="row">
    <button class="btn btn-danger btn-md">Delete Story</button>
  </div>
</div>

<div class="card">
  <div class="card-label">With Icons</div>
  <div class="row">
    <button class="btn btn-primary btn-md">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      New Briefing
    </button>
    <button class="btn btn-secondary btn-md">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      Search
    </button>
  </div>
</div>

</body>
</html>
