<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:40px 24px; background:var(--surface-0); font-family:var(--font-body); color:var(--text-0); }
  .card { max-width:700px; margin:0 auto 48px; }
  .card-label { font-size:var(--text-xs); font-weight:var(--weight-semibold); text-transform:uppercase; letter-spacing:var(--tracking-widest); color:var(--text-3); margin-bottom:16px; }

  /* Top nav */
  .nav-demo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 64px;
    background: rgba(248,248,246,0.86);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line-1);
    border-radius: var(--radius-md);
  }
  .nav-brand {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 1.35rem;
    font-weight: 400;
    color: var(--text-0);
    text-decoration: none;
    letter-spacing: -0.01em;
  }
  .nav-brand:hover { color: var(--primary-2); }
  .nav-links { display:flex; align-items:center; gap:4px; }
  .nav-link {
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    color: var(--text-2);
    text-decoration: none;
    transition: background var(--duration-fast) var(--ease-default), color var(--duration-fast) var(--ease-default);
  }
  .nav-link:hover { background: rgba(16,18,24,0.04); color: var(--text-0); }
  .nav-link.active { color: var(--primary-2); background: var(--primary-0); }

  /* Tabs */
  .tabs-demo { display:flex; gap:0; border-bottom:1px solid var(--line-1); margin-bottom:16px; }
  .tab {
    padding: 10px 16px;
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    color: var(--text-2);
    border: none;
    background: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color var(--duration-fast) var(--ease-default), border-color var(--duration-fast) var(--ease-default);
  }
  .tab:hover { color: var(--text-0); }
  .tab.active { color: var(--text-0); border-bottom-color: var(--primary-2); }

  /* Breadcrumbs */
  .breadcrumbs {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: var(--text-sm);
    color: var(--text-3);
  }
  .breadcrumbs a {
    color: var(--text-2);
    text-decoration: none;
    transition: color var(--duration-fast) var(--ease-default);
  }
  .breadcrumbs a:hover { color: var(--primary-2); }
  .breadcrumbs .current { color: var(--text-0); font-weight: var(--weight-medium); }
  .breadcrumbs .sep { color: var(--text-3); }
</style>
</head>
<body>

<div class="card">
  <div class="card-label">Top Navigation</div>
  <div class="nav-demo">
    <a class="nav-brand" href="#">Dispatch</a>
    <div class="nav-links">
      <a class="nav-link active" href="#">Today</a>
      <a class="nav-link" href="#">Archive</a>
      <a class="nav-link" href="#">Saved</a>
      <a class="nav-link" href="#">Settings</a>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-label">Tabs</div>
  <div class="tabs-demo">
    <button class="tab active">All Stories</button>
    <button class="tab">World</button>
    <button class="tab">Tech</button>
    <button class="tab">Markets</button>
    <button class="tab">Culture</button>
  </div>
  <p style="font-size:var(--text-sm); color:var(--text-2);">Tab content area would appear below.</p>
</div>

<div class="card">
  <div class="card-label">Breadcrumbs</div>
  <div class="breadcrumbs">
    <a href="#">Archive</a>
    <span class="sep">&rarr;</span>
    <a href="#">Apr 2026</a>
    <span class="sep">&rarr;</span>
    <span class="current">Apr 20</span>
  </div>
</div>

</body>
</html>
