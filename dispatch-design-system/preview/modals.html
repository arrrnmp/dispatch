<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:40px 24px; background:var(--surface-0); font-family:var(--font-body); color:var(--text-0); }
  .card { max-width:700px; margin:0 auto 48px; }
  .card-label { font-size:var(--text-xs); font-weight:var(--weight-semibold); text-transform:uppercase; letter-spacing:var(--tracking-widest); color:var(--text-3); margin-bottom:16px; }

  /* Modal overlay */
  .modal-overlay {
    position: relative;
    background: rgba(16,18,24,0.4);
    border-radius: var(--radius-lg);
    padding: 60px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .modal {
    background: var(--surface-0);
    border: 1px solid var(--line-2);
    border-radius: var(--radius-lg);
    box-shadow: var(--sh-xl);
    width: 100%;
    max-width: 420px;
    overflow: hidden;
  }
  .modal-header {
    padding: 20px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .modal-header h3 {
    font-family: var(--font-display);
    font-style: italic;
    font-size: var(--text-2xl);
    margin: 0;
    line-height: var(--leading-snug);
  }
  .modal-close {
    background: none;
    border: none;
    color: var(--text-3);
    cursor: pointer;
    padding: 4px;
    border-radius: var(--radius-sm);
    transition: color var(--duration-fast) var(--ease-default), background var(--duration-fast) var(--ease-default);
  }
  .modal-close:hover { color: var(--text-0); background: var(--surface-1); }
  .modal-body {
    padding: 12px 24px 20px;
    font-size: var(--text-sm);
    color: var(--text-1);
    line-height: var(--leading-normal);
  }
  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--line-1);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    background: var(--surface-1);
  }
  .modal-btn {
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-family: var(--font-body);
    font-weight: var(--weight-semibold);
    font-size: var(--text-sm);
    cursor: pointer;
    border: 1px solid transparent;
    transition: background var(--duration-fast) var(--ease-default);
  }
  .modal-btn-secondary {
    background: var(--surface-0);
    color: var(--text-0);
    border-color: var(--line-2);
  }
  .modal-btn-secondary:hover { background: var(--surface-2); }
  .modal-btn-primary {
    background: var(--primary-2);
    color: #fff;
    border-color: var(--primary-2);
  }
  .modal-btn-primary:hover { background: var(--primary-3); }
  .modal-btn-danger {
    background: var(--error-1);
    color: #fff;
    border-color: var(--error-1);
  }
  .modal-btn-danger:hover { background: var(--crimson-2); }
</style>
</head>
<body>

<div class="card">
  <div class="card-label">Modal · Confirm Action</div>
  <div class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Remove bookmark?</h3>
        <button class="modal-close" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        This story will be removed from your saved list. You can always re-bookmark it later from the archive.
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-secondary">Cancel</button>
        <button class="modal-btn modal-btn-danger">Remove</button>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-label">Modal · Settings</div>
  <div class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Delivery preferences</h3>
        <button class="modal-close" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div style="display:flex;flex-direction:column;gap:12px;">
          <label style="display:flex;align-items:center;gap:10px;font-size:var(--text-sm);color:var(--text-1);">
            <input type="checkbox" checked style="accent-color:var(--primary-2);width:18px;height:18px;">
            Include story summaries
          </label>
          <label style="display:flex;align-items:center;gap:10px;font-size:var(--text-sm);color:var(--text-1);">
            <input type="checkbox" style="accent-color:var(--primary-2);width:18px;height:18px;">
            Include source links
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-secondary">Cancel</button>
        <button class="modal-btn modal-btn-primary">Save changes</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
