<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 40px 24px;
    background: var(--surface-0);
    font-family: var(--font-body);
    color: var(--text-0);
  }
  .card { max-width: 700px; margin: 0 auto 48px; }
  .card-label {
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    text-transform: uppercase;
    letter-spacing: var(--tracking-widest);
    color: var(--text-3);
    margin-bottom: 16px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  /* Badge / pill */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: var(--radius-full);
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-wide);
    text-transform: uppercase;
    border: 1px solid var(--line-2);
    background: var(--surface-0);
    color: var(--text-2);
    transition: color var(--duration-fast) var(--ease-default),
                border-color var(--duration-fast) var(--ease-default),
                background var(--duration-fast) var(--ease-default);
    cursor: default;
  }
  .badge:hover {
    color: var(--primary-2);
    border-color: var(--primary-2);
    background: var(--primary-0);
  }

  /* Section badge */
  .badge-world { color: var(--primary-2); border-color: rgba(242,101,34,0.3); background: var(--primary-0); }
  .badge-tech { color: var(--teal-1); border-color: rgba(26,154,138,0.3); background: var(--teal-0); }
  .badge-markets { color: var(--gold-1); border-color: rgba(201,148,26,0.3); background: var(--gold-0); }
  .badge-culture { color: var(--violet-1); border-color: rgba(107,76,154,0.3); background: var(--violet-0); }
  .badge-breaking { color: var(--crimson-1); border-color: rgba(196,50,46,0.3); background: var(--crimson-0); }

  /* Status dots */
  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.7;
  }

  /* Tag */
  .tag {
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: var(--radius-full);
    font-size: 10px;
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-wide);
    text-transform: uppercase;
    border: 1px solid var(--line-2);
    background: var(--surface-0);
    color: var(--text-2);
    cursor: pointer;
    text-decoration: none;
    transition: color var(--duration-fast) var(--ease-default),
                border-color var(--duration-fast) var(--ease-default),
                background var(--duration-fast) var(--ease-default);
  }
  .tag:hover {
    color: var(--primary-2);
    border-color: var(--primary-2);
    background: var(--primary-0);
  }

  /* Number badge */
  .num-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: var(--radius-full);
    background: var(--primary-2);
    color: #fff;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: var(--weight-semibold);
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-label">Section Badges</div>
  <div class="row">
    <span class="badge badge-world"><span class="badge-dot"></span>World</span>
    <span class="badge badge-tech"><span class="badge-dot"></span>Tech</span>
    <span class="badge badge-markets"><span class="badge-dot"></span>Markets</span>
    <span class="badge badge-culture"><span class="badge-dot"></span>Culture</span>
    <span class="badge badge-breaking"><span class="badge-dot"></span>Breaking</span>
  </div>
</div>

<div class="card">
  <div class="card-label">Default Badges</div>
  <div class="row">
    <span class="badge">AI</span>
    <span class="badge">Climate</span>
    <span class="badge">Geopolitics</span>
    <span class="badge">Earnings</span>
  </div>
</div>

<div class="card">
  <div class="card-label">Tags</div>
  <div class="row">
    <a class="tag">inflation</a>
    <a class="tag">eu</a>
    <a class="tag">rate-decision</a>
    <a class="tag">ai-regulation</a>
    <a class="tag">earnings</a>
  </div>
</div>

<div class="card">
  <div class="card-label">Number Badges</div>
  <div class="row">
    <span style="display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--text-1);">
      Unread <span class="num-badge">7</span>
    </span>
    <span style="display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--text-1);">
      Sources <span class="num-badge">3</span>
    </span>
  </div>
</div>

</body>
</html>
