<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:40px 24px; background:var(--surface-0); font-family:var(--font-body); color:var(--text-0); }
  .card { max-width:700px; margin:0 auto 48px; }
  .card-label { font-size:var(--text-xs); font-weight:var(--weight-semibold); text-transform:uppercase; letter-spacing:var(--tracking-widest); color:var(--text-3); margin-bottom:24px; }

  .logo-display {
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  /* Wordmark */
  .wordmark {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    letter-spacing: -0.02em;
    color: var(--text-0);
    line-height: 1;
  }
  .wordmark-lg { font-size: 3rem; }
  .wordmark-md { font-size: 1.8rem; }
  .wordmark-sm { font-size: 1.2rem; }

  /* Accent bar under logo */
  .logo-accent {
    width: 24px;
    height: 2px;
    background: var(--primary-2);
    border-radius: 1px;
    margin-top: 4px;
  }

  /* Mark */
  .logo-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border: 2px solid var(--primary-2);
    border-radius: var(--radius-md);
    font-family: var(--font-display);
    font-style: italic;
    font-size: 1.5rem;
    color: var(--primary-2);
    line-height: 1;
  }
  .logo-mark-sm {
    width: 32px;
    height: 32px;
    font-size: 1rem;
    border-radius: var(--radius-sm);
  }

  /* Inverted */
  .logo-inverted-wrap {
    background: var(--surface-5);
    padding: 32px;
    border-radius: var(--radius-md);
  }
  .logo-inverted-wrap .wordmark { color: #e8e8e4; }
  .logo-inverted-wrap .logo-accent { background: var(--primary-2); }
  .logo-inverted-wrap .logo-mark {
    background: var(--primary-2);
    color: #fff;
    border-color: var(--primary-2);
  }

  /* Favicon */
  .favicon-preview {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .favicon {
    width: 32px;
    height: 32px;
    background: var(--primary-2);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 1rem;
    color: #fff;
    line-height: 1;
    font-weight: 400;
  }
  .favicon-sm {
    width: 16px;
    height: 16px;
    font-size: 0.5rem;
    border-radius: 2px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-label">Wordmark</div>
  <div class="logo-display">
    <div class="logo-row">
      <div>
        <div class="wordmark wordmark-lg">Dispatch</div>
        <div class="logo-accent"></div>
      </div>
    </div>
    <div class="logo-row">
      <div>
        <div class="wordmark wordmark-md">Dispatch</div>
        <div class="logo-accent"></div>
      </div>
      <span style="font-size:var(--text-xs); color:var(--text-3); text-transform:uppercase; letter-spacing:var(--tracking-widest);">Navigation size</span>
    </div>
    <div class="logo-row">
      <div>
        <div class="wordmark wordmark-sm">Dispatch</div>
        <div class="logo-accent" style="width:16px;"></div>
      </div>
      <span style="font-size:var(--text-xs); color:var(--text-3); text-transform:uppercase; letter-spacing:var(--tracking-widest);">Small / Mobile</span>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-label">Logo Mark · "D"</div>
  <div class="logo-row">
    <div class="logo-mark">D</div>
    <div class="logo-mark logo-mark-sm">D</div>
  </div>
</div>

<div class="card">
  <div class="card-label">Inverted · Dark Background</div>
  <div class="logo-inverted-wrap">
    <div class="logo-row">
      <div>
        <div class="wordmark wordmark-md">Dispatch</div>
        <div class="logo-accent"></div>
      </div>
      <div class="logo-mark" style="margin-left:12px;">D</div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-label">Favicon</div>
  <div class="favicon-preview">
    <div class="favicon">D</div>
    <div class="favicon favicon-sm">D</div>
    <span style="font-size:var(--text-xs); color:var(--text-3);">32px / 16px</span>
  </div>
</div>

<div class="card">
  <div class="card-label">Byline</div>
  <div style="font-size:var(--text-sm); color:var(--text-2);">
    by <span style="font-family:var(--font-display); font-style:italic; color:var(--text-0);">Aaron Mompi&eacute;</span>
  </div>
</div>

</body>
</html>
