<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:40px 24px; background:var(--surface-0); font-family:var(--font-body); color:var(--text-0); }
  .card { max-width:700px; margin:0 auto 48px; }
  .card-label { font-size:var(--text-xs); font-weight:var(--weight-semibold); text-transform:uppercase; letter-spacing:var(--tracking-widest); color:var(--text-3); margin-bottom:16px; }
  .row { display:flex; align-items:center; gap:24px; flex-wrap:wrap; margin-bottom:24px; }
  .toggle-item { display:flex; align-items:center; gap:10px; }
  .toggle-label { font-size:var(--text-sm); color:var(--text-1); }
  .checkbox { width:18px; height:18px; border:1.5px solid var(--line-3); border-radius:var(--radius-xs); appearance:none; background:var(--surface-0); cursor:pointer; transition:background var(--duration-fast) var(--ease-default),border-color var(--duration-fast) var(--ease-default); position:relative; }
  .checkbox:checked { background:var(--primary-2); border-color:var(--primary-2); }
  .checkbox:checked::after { content:''; position:absolute; left:5px; top:2px; width:5px; height:9px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }
  .checkbox:focus-visible { outline:2px solid var(--primary-2); outline-offset:2px; }
  .checkbox:disabled { opacity:0.4; cursor:not-allowed; }
  .radio { width:18px; height:18px; border:1.5px solid var(--line-3); border-radius:50%; appearance:none; background:var(--surface-0); cursor:pointer; transition:border-color var(--duration-fast) var(--ease-default); position:relative; }
  .radio:checked { border-color:var(--primary-2); }
  .radio:checked::after { content:''; position:absolute; top:3px; left:3px; width:8px; height:8px; border-radius:50%; background:var(--primary-2); }
  .radio:focus-visible { outline:2px solid var(--primary-2); outline-offset:2px; }
  .switch { width:40px; height:22px; border-radius:11px; background:var(--surface-3); appearance:none; cursor:pointer; position:relative; transition:background var(--duration-normal) var(--ease-default); border:none; flex-shrink:0; }
  .switch::after { content:''; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:var(--sh-xs); transition:transform var(--duration-normal) var(--ease-spring); }
  .switch:checked { background:var(--primary-2); }
  .switch:checked::after { transform:translateX(18px); }
  .switch:focus-visible { outline:2px solid var(--primary-2); outline-offset:2px; }
</style>
</head>
<body>
<div class="card">
  <div class="card-label">Checkboxes</div>
  <div class="row">
    <div class="toggle-item"><input type="checkbox" class="checkbox" id="c1" checked><label class="toggle-label" for="c1">World</label></div>
    <div class="toggle-item"><input type="checkbox" class="checkbox" id="c2" checked><label class="toggle-label" for="c2">Tech</label></div>
    <div class="toggle-item"><input type="checkbox" class="checkbox" id="c3"><label class="toggle-label" for="c3">Markets</label></div>
    <div class="toggle-item"><input type="checkbox" class="checkbox" id="c4" disabled><label class="toggle-label" for="c4">Disabled</label></div>
  </div>
</div>
<div class="card">
  <div class="card-label">Radio Buttons</div>
  <div class="row">
    <div class="toggle-item"><input type="radio" name="f" class="radio" id="r1" checked><label class="toggle-label" for="r1">Daily</label></div>
    <div class="toggle-item"><input type="radio" name="f" class="radio" id="r2"><label class="toggle-label" for="r2">Weekly</label></div>
    <div class="toggle-item"><input type="radio" name="f" class="radio" id="r3"><label class="toggle-label" for="r3">Breaking only</label></div>
  </div>
</div>
<div class="card">
  <div class="card-label">Switches</div>
  <div class="row">
    <div class="toggle-item"><input type="checkbox" class="switch" id="s1" checked><label class="toggle-label" for="s1">Notifications</label></div>
    <div class="toggle-item"><input type="checkbox" class="switch" id="s2"><label class="toggle-label" for="s2">Dark mode</label></div>
    <div class="toggle-item"><input type="checkbox" class="switch" id="s3" checked><label class="toggle-label" for="s3">Auto-refresh</label></div>
  </div>
</div>
</body>
</html>
